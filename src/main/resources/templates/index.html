<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل تعقيد النصوص العربية</title>
    <link rel="stylesheet" th:href="@{/static/style.css}">
    <script th:src="@{/static/app.js}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.css">
    <style>
        body {
            font-family: 'Amiri', serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
            flex: 1;
        }
        .text-area {
            min-height: 200px;
            font-size: 18px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-analyze {
            background-color: #28a745;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .content-wrapper {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
            margin-top: auto;
        }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">محلل تعقيد النصوص العربية</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/">الرئيسية</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/about">حول التطبيق</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="content-wrapper">
    <div class="container">
        <div class="header">
            <h1>محلل تعقيد النصوص العربية</h1>
            <p class="lead">أدخل النص العربي لتحليل مستوى تعقيده</p>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/analyze}" method="post" th:object="${textRequest}">
                    <div class="mb-3">
                        <label for="arabicText" class="form-label">النص العربي:</label>
                        <textarea class="form-control text-area" id="arabicText" th:field="*{arabicText}" rows="6"
                                  placeholder="أدخل النص العربي هنا..."></textarea>
                    </div>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-analyze">تحليل النص</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2025 - محلل تعقيد النصوص العربية</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
