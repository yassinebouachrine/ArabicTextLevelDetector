<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Erreur</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<h1>Une erreur s'est produite</h1>
<p th:text="${message}">Message d'erreur</p>
<p>Statut: <span th:text="${status}"></span></p>
<p th:if="${exception}" th:text="${exception.message}">Exception message</p>
<a href="/">Retour à la page d'accueil</a>
</body>
</html>
