<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Classification Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Classification Result</h1>

    <div class="card mt-4">
        <div class="card-header">
            Original Text
        </div>
        <div class="card-body">
            <p class="card-text" th:text="${originalText}"></p>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header">
            Result
        </div>
        <div class="card-body">
            <p>Level: <span th:text="${result.level}"></span></p>
            <p>Confidence: <span th:text="${#numbers.formatDecimal(result.confidence, 1, 2)}"></span></p>
        </div>
    </div>

    <a href="/" class="btn btn-primary mt-4">Back to Input</a>
</div>
</body>
</html>
