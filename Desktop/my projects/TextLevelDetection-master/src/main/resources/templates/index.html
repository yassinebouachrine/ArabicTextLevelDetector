<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arabic Text Level Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Arabic Text Level Detection</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/classify}" th:object="${textInput}" method="post">
        <div class="mb-3">
            <label for="text" class="form-label">Enter Arabic Text:</label>
            <textarea class="form-control" id="text" th:field="*{text}"
                      rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Classify</button>
    </form>
</div>
</body>
</html>
